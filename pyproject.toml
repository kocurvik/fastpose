[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastpose"
version = "1.0.0"
description = "Fast Python/Numba backend for robust relative pose estimation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "fastpose contributors" }
]
dependencies = [
    "numba",
    "numpy",
    "scipy",
    "tqdm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.scripts]
fastpose-warmup = "fastpose.estimators.warmup:main"
fastpose-clean-cache = "fastpose.clean_cache:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["fastpose", "fastpose.cuda", "fastpose.cuda.problems", "fastpose.estimators", "fastpose.refiners", "fastpose.scorers", "fastpose.solvers"]
